<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C++ 學習路線產生器｜免費學習計畫</title>
<style>
  :root{--bg:#f4f6fb;--card:#fff;--ink:#1f2937;--muted:#6b7280;--primary:#4f46e5;--primary-dark:#4338ca;--accent:#f59e0b;--line:#e5e7eb;--ok:#059669;--soft:#eef2ff;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;}
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 80px;}
  header.hero{background:linear-gradient(135deg,#312e81 0%,#4f46e5 60%,#6366f1 100%);color:#fff;border-radius:20px;padding:36px 28px;margin-bottom:24px;}
  header.hero h1{font-size:1.7rem;letter-spacing:.5px;margin-bottom:8px;}
  header.hero p{opacity:.92;font-size:.98rem;}
  .badge{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);padding:2px 12px;border-radius:999px;font-size:.8rem;margin-bottom:12px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .card h2{font-size:1.15rem;margin-bottom:16px;color:var(--primary-dark);}
  .field{margin-bottom:18px;}
  .field label{display:block;font-weight:600;font-size:.95rem;margin-bottom:6px;}
  .field .hint{font-size:.82rem;color:var(--muted);font-weight:400;margin-left:6px;}
  input[type=text],select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:1rem;font-family:inherit;background:#fff;color:var(--ink);}
  input:focus,select:focus{outline:none;border-color:var(--primary);}
  .radio-group{display:flex;flex-wrap:wrap;gap:10px;}
  .radio-group label{flex:1 1 30%;min-width:120px;text-align:center;cursor:pointer;border:1.5px solid var(--line);border-radius:10px;padding:10px 8px;font-size:.9rem;font-weight:500;transition:all .15s;background:#fff;}
  .radio-group input{display:none;}
  .radio-group label:hover{border-color:var(--primary);}
  .radio-group input:checked+label{background:var(--soft);border-color:var(--primary);color:var(--primary-dark);font-weight:700;}
  .btn{display:inline-block;border:none;cursor:pointer;font-family:inherit;background:var(--primary);color:#fff;padding:14px 28px;border-radius:12px;font-size:1.05rem;font-weight:700;width:100%;transition:background .15s;}
  .btn:hover{background:var(--primary-dark);}
  .btn.secondary{background:#fff;color:var(--primary);border:1.5px solid var(--primary);width:auto;padding:10px 20px;font-size:.9rem;}
  .btn.secondary:hover{background:var(--soft);}
  .btn.ghost{background:#fff;color:var(--muted);border:1.5px solid var(--line);width:auto;padding:10px 20px;font-size:.9rem;}
  .btn.ghost:hover{border-color:var(--ink);color:var(--ink);}
</style>
</head><style>
  .plan-header{background:linear-gradient(135deg,#065f46 0%,#059669 100%);color:#fff;border-radius:20px;padding:28px;margin-bottom:20px;}
  .plan-header h2{font-size:1.4rem;margin-bottom:6px;}
  .plan-header .meta{font-size:.9rem;opacity:.92;}
  .kpi-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;}
  .kpi{background:rgba(255,255,255,.15);border-radius:12px;padding:10px 16px;font-size:.85rem;}
  .kpi b{display:block;font-size:1.15rem;}
  section.unit{border-left:4px solid var(--primary);}
  .unit h3{font-size:1.05rem;margin-bottom:6px;}
  .unit .week-tag{font-size:.75rem;font-weight:700;color:var(--primary);background:var(--soft);padding:2px 10px;border-radius:999px;display:inline-block;margin-bottom:8px;}
  .goal-list{margin:10px 0 14px 18px;font-size:.92rem;}
  .goal-list li{margin-bottom:4px;}
  .sub-title{font-weight:700;font-size:.88rem;color:var(--ok);margin:14px 0 6px;}
  .task-box{background:var(--soft);border-radius:12px;padding:12px 16px;font-size:.9rem;margin-top:4px;}
  pre.code{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:14px 16px;font-family:"Cascadia Code",Consolas,monospace;font-size:.85rem;overflow-x:auto;margin-top:8px;line-height:1.6;white-space:pre;}
  details{background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:8px;}
  details summary{cursor:pointer;font-weight:600;font-size:.88rem;color:var(--primary-dark);}
  details .ans{margin-top:8px;font-size:.88rem;}
  .project-box{border:1.5px dashed var(--accent);background:#fffbeb;border-radius:12px;padding:12px 16px;margin-top:8px;font-size:.9rem;}
  .resource-list{list-style:none;}
  .resource-list li{padding:10px 0;border-bottom:1px dashed var(--line);font-size:.92rem;}
  .resource-list li:last-child{border-bottom:none;}
  .resource-list a{color:var(--primary);font-weight:600;text-decoration:none;}
  .resource-list a:hover{text-decoration:underline;}
  .resource-list .desc{display:block;color:var(--muted);font-size:.82rem;}
  .note-box{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px 16px;font-size:.88rem;margin-bottom:20px;}
  .action-bar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0;}
  .footer-note{text-align:center;font-size:.8rem;color:var(--muted);margin-top:40px;}
  .hidden{display:none !important;}
  #result{animation:fadein .4s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  @media print{body{background:#fff;}.no-print{display:none !important;}.hero,.card,.plan-header,section.unit{box-shadow:none;border-radius:8px;}.wrap{max-width:100%;padding:0;}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <span class="badge">MVP 第一版・只做 C++ 基礎入門</span>
    <h1>C++ 學習路線產生器</h1>
    <p>填一份 30 秒的問卷，系統幫你生出個人化的學習路線、每日任務、免費資源、練習題與小專案。<br>不需要懂程式，照著做就好。</p>
  </header>

  <div class="note-box">
    📌 <b>目前版本</b>：只支援 <b>C++ 基礎入門</b>（從零到寫得出小程式）。遊戲、競賽、其他語言之後再加。
  </div>

  <div class="card" id="quizCard">
    <h2>開始之前，告訴我幾件事</h2>
    <form id="quizForm" onsubmit="generatePlan(event)">
      <div class="field">
        <label>想學的技能／方向</label>
        <input type="text" id="f_skill" placeholder="例如：C++ 基礎入門、把程式寫出來" value="C++ 基礎入門">
      </div>
      <div class="field">
        <label>你現在的程度 <span class="hint">誠實選，不用客氣</span></label>
        <div class="radio-group">
          <input type="radio" name="level" id="lv0" value="newbie" checked><label for="lv0">完全新手<br><small>沒寫過程式</small></label>
          <input type="radio" name="level" id="lv1" value="some"><label for="lv1">會一點點<br><small>看過但沒上手</small></label>
          <input type="radio" name="level" id="lv2" value="experienced"><label for="lv2">有經驗<br><small>寫過其他語言</small></label>
        </div>
      </div>
      <div class="field">
        <label>每天可以投入多少時間？</label>
        <div class="radio-group">
          <input type="radio" name="time" id="t15" value="15" checked><label for="t15">15 分鐘<br><small>通勤偷學</small></label>
          <input type="radio" name="time" id="t30" value="30"><label for="t30">30 分鐘<br><small>下班／下課</small></label>
          <input type="radio" name="time" id="t60" value="60"><label for="t60">1 小時<br><small>認真練</small></label>
          <input type="radio" name="time" id="t120" value="120"><label for="t120">2 小時以上<br><small>衝刺型</small></label>
        </div>
      </div>
      <div class="field">
        <label>想達成什麼目標？</label>
        <input type="text" id="f_goal" placeholder="例如：看得懂 C++ 程式，能自己寫出小工具">
      </div>
      <div class="field">
        <label>預計多久完成？</label>
        <div class="radio-group">
          <input type="radio" name="duration" id="d2" value="2"><label for="d2">2 週<br><small>衝刺</small></label>
          <input type="radio" name="duration" id="d4" value="4" checked><label for="d4">1 個月<br><small>標準</small></label>
          <input type="radio" name="duration" id="d12" value="12"><label for="d12">3 個月<br><small>扎實</small></label>
        </div>
      </div>
      <button type="submit" class="btn">產生我的學習計畫 ✨</button>
    </form>
  </div><div id="result" class="hidden">
    <div class="plan-header">
      <h2>你的 C++ 學習計畫</h2>
      <div class="meta" id="planSummary"></div>
      <div class="kpi-row" id="kpiRow"></div>
    </div>
    <div class="action-bar no-print">
      <button class="btn secondary" onclick="window.print()">🖨️ 列印／存成 PDF</button>
      <button class="btn ghost" onclick="backToQuiz()">↩ 重新填寫</button>
    </div>
    <div class="card">
      <h2>🧭 一、學習路線總覽</h2>
      <div id="routeOverview"></div>
    </div>
    <div class="card">
      <h2>🗓️ 二、每週計畫：每日任務＋練習題＋小專案</h2>
      <div id="weeklyPlan"></div>
    </div>
    <div class="card">
      <h2>📚 三、免費學習資源</h2>
      <ul class="resource-list" id="resources"></ul>
    </div>
    <div class="card">
      <h2>🏆 四、結業驗收</h2>
      <div id="finalProject"></div>
    </div>
  </div>
  <div class="footer-note">C++ 學習路線產生器・第一版 MVP・全部內容免費</div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
